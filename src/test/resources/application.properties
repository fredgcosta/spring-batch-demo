spring.application.name=souJavaBsb
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_structured_entries=false
spring.jpa.properties.hibernate.cache.use_minimal_puts=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.h2.console.enabled=true
management.otlp.metrics.export.enabled=false
# management.otlp.tracing.export.enabled is a stale Boot 3 key in Boot 4.1 (no-op); the real
# switch for the OTel starter's span exporter is management.tracing.export.otlp.enabled.
management.tracing.export.otlp.enabled=false
# Disables the OTel logging exporter too (root logger has the OTEL appender attached),
# otherwise tests would try to export logs via OTLP just like traces/metrics.
management.logging.export.otlp.enabled=false
