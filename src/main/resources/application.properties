spring.application.name=souJavaBsb
spring.cloud.task.name=souJavaBsb-task
spring.batch.name=souJavaBsb-Batch
info.app.name=@project.artifactId@
info.app.description=@project.description@
info.app.version=@project.version@
spring.datasource.url=jdbc:postgresql://localhost:5432/dataflow?useSSL=false
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=root
spring.datasource.password=rootpw
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.batch_size=2500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_structured_entries=false
spring.jpa.properties.hibernate.cache.use_minimal_puts=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.instance=local
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
# Endpoint OTLP de traces (chave nova do Boot 4; a antiga management.otlp.tracing.export.url
# do Boot 3 nao e mais reconhecida). O collector do stack LGTM expoe /v1/traces em 4318.
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
# Endpoint OTLP de logs. O appender OTel (logback-spring.xml) envia os eventos para a API
# OpenTelemetry; o SDK autoconfigurado os exporta para este endpoint (/v1/logs do LGTM).
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
# Amostra 100% das execucoes. Como o job roda uma vez e encerra, o default de 10%
# deixaria a maioria das execucoes sem trace (e sem trace_id/span_id nos logs).
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=*
logging.level.com.example.demo=ERROR
logging.level.org.springframework.cloud.task=ERROR
logging.level.org.springframework.batch.infrastructure.item.data=ERROR
