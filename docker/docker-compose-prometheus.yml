version: "3.8"

# Extends the default docker-compose.yml with OpenTelemetry Collector + Prometheus/Grafana monitoring.
# Substitui o antigo prometheus-rsocket-proxy (descontinuado) por um OTel Collector recebendo OTLP.
# Usage: docker-compose -f ./docker-compose.yml -f ./docker-compose-prometheus.yml up
services:
  dataflow-server:
    environment:
      - |
        SPRING_APPLICATION_JSON=
        {
          "spring.cloud.dataflow.applicationProperties":{
            "task.management.otlp.metrics.export":{
                "enabled":true,
                "url":"http://otel-collector:4318/v1/metrics"
            },
            "stream.management.otlp.metrics.export":{
                "enabled":true,
                "url":"http://otel-collector:4318/v1/metrics"
            }
          },
          "spring.cloud.dataflow.grafana-info.url":"http://localhost:3000"
        }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus exporter (scrape endpoint)
    networks:
      - scdf-net

  grafana:
    image: springcloud/spring-cloud-dataflow-grafana-prometheus:${DATAFLOW_VERSION:-2.11.5}
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - scdf-net

  # NOTA: a config interna de scrape do Prometheus embutido nesta imagem do SCDF foi feita
  # originalmente para o prometheus-rsocket-proxy; para que o Prometheus raspe o endpoint
  # :8889 do otel-collector pode ser necessário montar um prometheus.yml customizado
  # (não verificado neste spike — confirmar no deploy real).
  prometheus:
    image: springcloud/spring-cloud-dataflow-prometheus-local:${DATAFLOW_VERSION:-2.11.5}
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - scdf-net
